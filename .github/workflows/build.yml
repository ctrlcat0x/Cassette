name: Native builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
          - platform: linux-x64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "${RELEASE_TAG#v}" = "$version"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config dpkg-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libfontconfig1-dev libssl-dev libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev mpv patchelf

      - name: Install macOS playback build dependencies
        if: runner.os == 'macOS'
        run: brew install mpv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare bundled playback tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/bundle-runtime.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release
        run: cargo build --release --locked --features bundled-runtime --bin cassette

      - name: Smoke test native executable
        shell: bash
        run: |
          set -euo pipefail
          executable=target/release/cassette
          if [[ "$RUNNER_OS" == Windows ]]; then executable+=.exe; fi
          export RAAG_DATA_DIR="$RUNNER_TEMP/cassette-runtime-smoke"
          "$executable" --verify-runtime
          "$executable" --quit > smoke.log 2>&1
          if [[ -s smoke.log ]]; then cat smoke.log; exit 1; fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/stage -Force | Out-Null
          Copy-Item target/release/cassette.exe, LICENSE, README.md dist/stage
          Copy-Item assets/fonts/*OFL.txt, assets/icons/HUGEICONS-LICENSE.txt dist/stage
          Copy-Item assets/icons/LICENSE dist/stage/ICONS-LICENSE
          Copy-Item target/release/cassette.exe dist/cassette-windows-x64.exe
          Compress-Archive -Path dist/stage/* -DestinationPath dist/cassette-windows-x64.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          version=${version%%-*}
          app=dist/stage/Cassette.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist/icon.iconset
          cp target/release/cassette "$app/Contents/MacOS/"
          cp LICENSE README.md assets/fonts/*OFL.txt assets/icons/HUGEICONS-LICENSE.txt "$app/Contents/Resources/"
          cp assets/icons/LICENSE "$app/Contents/Resources/ICONS-LICENSE"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/cassette.png --out "dist/icon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/cassette.png --out "dist/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns dist/icon.iconset -o "$app/Contents/Resources/cassette.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Cassette</string>
            <key>CFBundleDisplayName</key><string>Cassette</string>
            <key>CFBundleIdentifier</key><string>app.raag.desktop</string>
            <key>CFBundleExecutable</key><string>cassette</string>
            <key>CFBundleIconFile</key><string>cassette.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleURLTypes</key><array><dict>
              <key>CFBundleURLName</key><string>app.raag.desktop</string>
              <key>CFBundleURLSchemes</key><array><string>cassette</string></array>
            </dict></array>
          </dict></plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          ln -s /Applications dist/stage/Applications
          hdiutil create -volname Cassette -srcfolder dist/stage -ov -format UDZO dist/cassette-macos-arm64.dmg
          hdiutil verify dist/cassette-macos-arm64.dmg

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          version=${version/-/\~}
          root=dist/package
          install -Dm755 target/release/cassette "$root/usr/bin/cassette"
          install -Dm644 packaging/cassette.desktop "$root/usr/share/applications/cassette.desktop"
          install -Dm644 assets/cassette-256.png "$root/usr/share/icons/hicolor/256x256/apps/cassette.png"
          install -Dm644 LICENSE "$root/usr/share/doc/cassette/copyright"
          cp README.md assets/fonts/*OFL.txt assets/icons/HUGEICONS-LICENSE.txt "$root/usr/share/doc/cassette/"
          cp assets/icons/LICENSE "$root/usr/share/doc/cassette/ICONS-LICENSE"
          mkdir -p debian "$root/DEBIAN"
          cat > debian/control <<EOF
          Source: cassette
          Maintainer: ctrlcat0x <developer.sahilrana@gmail.com>

          Package: cassette
          Architecture: any
          Description: Native desktop music player built with Rust and GPUI
          EOF
          dependencies=$(dpkg-shlibdeps -O target/release/cassette | sed 's/^shlibs:Depends=//')
          cat > "$root/DEBIAN/control" <<EOF
          Package: cassette
          Version: $version
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: ctrlcat0x <developer.sahilrana@gmail.com>
          Depends: $dependencies
          Description: Native desktop music player built with Rust and GPUI
          EOF
          dpkg-deb --build --root-owner-group "$root" dist/cassette-linux-x64.deb
          dpkg-deb --info dist/cassette-linux-x64.deb
          dpkg-deb --contents dist/cassette-linux-x64.deb

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: cassette-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cassette-*
          path: dist
          merge-multiple: true

      - name: Publish downloads and release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=false
          latest=true
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; latest=false; fi
          assets=(dist/cassette-windows-x64.exe dist/cassette-macos-arm64.dmg dist/cassette-linux-x64.deb)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          cat > release-notes.md <<'EOF'
          Cassette is a native desktop music player built with Rust and GPUI.

          ### Features
          - Browse and search YouTube Music, with optional account library sync.
          - Play local music, manage playlists and queues, and save favourites.
          - Synced lyrics, themes, equalizer, and system media controls.

          ### Downloads
          - **Windows x64:** `cassette-windows-x64.exe` — portable application.
          - **macOS Apple Silicon:** `cassette-macos-arm64.dmg` — drag Cassette into Applications.
          - **Linux x64:** `cassette-linux-x64.deb` — built on Ubuntu 24.04; install with `sudo apt install ./cassette-linux-x64.deb`.

          ### Before you start
          mpv, yt-dlp, and Deno are bundled in each application and extracted privately on first launch. No separate playback tool installation is needed. Google sign-in on Windows requires the Microsoft Edge WebView2 Runtime. macOS builds are ad-hoc signed and are not notarized.

          All three builds pass formatting, Clippy, native executable startup checks, and packaging validation. Please test playback and sign-in on your device and report problems through GitHub Issues.
          EOF
          if [[ "$prerelease" == true ]]; then
            printf '\nThis is a beta prerelease. Features and provider integrations may change.\n' >> release-notes.md
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft \
              --title "Cassette $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest" \
            --title "Cassette $RELEASE_TAG" --notes-file release-notes.md
