name: Native builds
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: ./scripts/install-playback-tools.ps1
        shell: pwsh
      - run: python scripts/collect-licenses.py
      - run: ./scripts/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: cassette-windows
          path: |
            dist/*.zip
            dist/*.msix
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cassette-macos
          path: dist/*.dmg
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config dpkg-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libfontconfig1-dev libssl-dev libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: bash scripts/package-linux.sh deb
      - uses: actions/upload-artifact@v4
        with:
          name: cassette-linux
          path: dist/*.deb
